<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCORM course test</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f4f7fa;color:#172b3b;display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}aside{padding:20px;overflow:auto;border-right:1px solid #bac8d1;background:#f7f9fb}#title{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 12px;overflow-wrap:anywhere}h2{font-size:14px;margin:22px 0 10px}p{line-height:1.5}button,select,input{font:inherit}button,select,.file{padding:9px 10px;border:1px solid #91a4b1;border-radius:6px;background:white;color:#172b3b}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #16829b;outline-offset:2px}.row{display:flex;gap:7px;margin:10px 0}.row>*{flex:1;min-width:0}label{display:block;margin:12px 0 5px}select{width:100%}.toggle{display:flex;align-items:center;gap:8px}.toggle input{width:18px;height:18px}.wide{width:100%;margin:8px 0}#status{padding:12px;background:#e4edf3;border-radius:6px;line-height:1.8;margin:16px 0}#notice{font-size:12px;line-height:1.5;color:#425766;min-height:36px}main{min-width:0;height:100vh;display:flex;flex-direction:column}iframe{width:100%;flex:1;border:0;background:white}details{margin:16px 0}pre{font:11px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}#folder{width:100%;font-size:12px;margin-top:8px}.hint{font-size:12px;color:#425766}.badge{font-size:11px;background:#fff2cb;padding:4px 7px;border-radius:4px;display:inline-block}summary{cursor:pointer}@media(max-width:740px){body{grid-template-columns:230px minmax(320px,1fr)}aside{padding:12px}}
</style></head><body>
<aside aria-label="Test controls"><header id="title">Course title</header><span class="badge">Author testing · draft content allowed</span>
<div class="row"><button id="restart" disabled>New attempt</button><button id="resume" disabled>Resume attempt</button></div>
<h2>Jump to</h2><label for="role">Role</label><select id="role" disabled></select><label for="module">Module</label><select id="module" disabled></select><label for="level">Level</label><select id="level" disabled><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="upperIntermediate">Upper Intermediate</option><option value="advanced">Advanced</option></select>
<label class="toggle"><input id="skip" type="checkbox">Skip restrictions <strong id="skip-label">Off</strong></label><button id="jump" class="wide" disabled>Jump to selection</button><button id="next" class="wide" disabled>Skip current step</button>
<p class="hint">Skip mode unlocks test navigation only. It does not award correct answers or passing scores.</p>
<button id="report" class="wide">Download test data</button><div id="status" aria-live="polite">Completion: incomplete · Success: unknown · Score: —</div>
<details open><summary>Recorded SCORM calls</summary><pre id="log">No calls yet.</pre></details>
<p id="notice" role="status">Preparing the test…</p>
<details><summary>Course files</summary><label>Load SCORM folder<input id="folder" type="file" webkitdirectory multiple></label><button id="save" class="wide" disabled>Save finalised folder</button></details>
</aside><main><iframe id="course" title="Course content" allow="fullscreen"></iframe></main>
<script src="./project-files.js"></script><script src="./package-store.js"></script><script src="./test-player.js"></script></body></html>
